# Standalone fixture crate used by the `deps sbom` capturer tests.
# The empty `[workspace]` table keeps it out of the secunit workspace so a
# root-level `cargo build` never tries to compile it.
[workspace]

[package]
name = "sbom-fixture-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
itoa = "1.0.11"
ryu = "1.0.18"
